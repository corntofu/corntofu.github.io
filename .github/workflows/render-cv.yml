name: Render a CV
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          # cv.yml carries fields the site's CV page needs but RenderCV rejects,
          # so render a converted copy next to it and delete it afterwards.
          rendercv_input="$(dirname "$cv_file")/cv.rendercv.yml"
          python bin/prepare_rendercv_input.py "$cv_file" "$rendercv_input"
          rendercv render "$rendercv_input" --settings $settings
          rm -f "$rendercv_input" "$(dirname "$cv_file")"/cv.rendercv-photo.*
          # keep only the PDFs (drops the .typ source and the photo copied next to it)
          find assets/rendercv/rendercv_output -type f ! -name "*.pdf" -delete
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
